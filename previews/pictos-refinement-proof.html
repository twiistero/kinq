<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#111310;color:#dfe2dc;font:11px Arial}main{display:grid;grid-template-columns:repeat(3,1fr);padding:24px;gap:10px}article{text-align:center;height:185px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;border:1px solid #30352c}svg{width:72px;height:72px;--ink:#b2ff1a}span{max-width:120px}</style></head><body><main id="proof"></main><script src="../assets/pictos/catalog.js?v=4.1"></script><script>proof.innerHTML=KINQ_PICTOS.filter(i=>["wrestling","feet","shibari","restraints","doll","belly","harness","sounding","fisting"].includes(i.id)).map(i=>`<article><svg viewBox="${i.viewBox}" data-id="${i.id}">${i.body}</svg><span>${i.name}</span></article>`).join('');requestAnimationFrame(()=>{document.querySelectorAll('svg').forEach(s=>{const b=s.getBBox();s.dataset.bounds=JSON.stringify({x:b.x,y:b.y,w:b.width,h:b.height})})})</script></body></html>
