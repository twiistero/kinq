<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Administration · KINQ</title>
  <link rel="icon" href="/assets/kinq-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/style.css">
  <script type="module" src="/admin/app.js"></script>
</head>
<body>
  <header>
    <a class="brand" href="/" aria-label="Kinq Administration, retour à l’accueil"><span class="brand-mark"><img src="/assets/kinq-symbol.svg" alt=""></span><span class="wordmark">kinq</span><span class="brand-label">ADMINISTRATION</span></a>
    <div class="head-right"><span id="identity"></span><button id="logout" hidden>Se déconnecter</button></div>
  </header>
  <main>
    <section id="login">
      <h1>ADMINISTRATION<span>KINQ.</span></h1>
      <p class="login-intro">Connecte-toi avec ton compte Google Workspace The Ether Company.</p>
      <a class="google-login" href="/api/admin/auth/login"><span class="google-mark" aria-hidden="true">G</span><span>Continuer avec Google</span><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 19 19 5M5 5h14v14"/></svg></a>
      <p class="login-note">Accès réservé aux comptes <strong>@theethercompany.com</strong>.</p>
      <p id="owner-login-status" role="status"></p>
    </section>
    <section id="workspace" hidden>
      <div class="intro"><div><p class="eyebrow">KINQ · ESPACE PRIVÉ</p><h1>ADMINISTRATION.</h1><p id="intro-detail">Vue d’ensemble des comptes, de la modération et du journal.</p></div><span class="stamp">ACCÈS PRIVÉ</span></div>
      <nav id="tabs" aria-label="Rubriques"><button data-tab="photos" class="active">Photos <b id="photo-count">0</b></button><button data-tab="members">Comptes</button><button data-tab="articles">NO TABOO</button><button data-tab="comments">Commentaires</button><button data-tab="staff">Équipe</button></nav>
      <div id="notice" role="status"></div><div id="content"></div>
    </section>
  </main>
</body>
</html>
