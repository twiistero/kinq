<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#b2ff1a"><title>Connexion — Kinq</title><link rel="icon" href="assets/kinq-icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"></head><body data-page="connexion"><div id="site-header"></div><main id="page-main"><section class="wrap account-flow"><div class="account-flow-copy"><p class="eyebrow">TON ESPACE KINQ</p><h1>On se retrouve.</h1><p>Une connexion simple, sans mot de passe à retenir.</p></div><div class="account-flow-card"><p class="eyebrow">CONNEXION / KINQ</p><h2>Ton code par e-mail.</h2><p>Indique ton adresse. Nous t’enverrons un code à usage unique.</p><form id="login-form"><label for="login-email">Adresse e-mail</label><input id="login-email" type="email" name="email" autocomplete="email" placeholder="toi@exemple.fr" required><button class="button signup-submit" type="submit">Recevoir un code <svg aria-hidden="true"><use href="#arrow"/></svg></button></form><form id="login-code-form" hidden><label for="login-code">Code à 6 chiffres</label><input id="login-code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button class="button signup-submit" type="submit">Se connecter</button></form><p id="login-status" role="status" aria-live="polite"></p><p class="signup-footnote">Un souci d’accès ? <a href="centre-aide.html#code-non-recu">Voir l’aide</a></p><a class="underlink" href="inscription.html">Pas encore de compte ? Rejoindre Kinq</a></div></section></main><div id="site-footer"></div><dialog id="dialog"><button class="dialog-close" aria-label="Fermer"><svg><use href="#close"/></svg></button><div id="dialog-content"></div></dialog><div id="toast" role="status" aria-live="polite"></div><script src="shell.js"></script><script src="app.js"></script><script src="connexion.js"></script></body></html>
