<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kinq — Aperçus desktop et mobile</title><style>*{box-sizing:border-box}body{margin:0;background:#dfe2d7;color:#171916;font:13px Arial,sans-serif}header{height:64px;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:0 24px;background:#171916;color:white}strong{font-size:25px;letter-spacing:-1.8px}nav{display:flex;gap:6px}button,a{font:inherit;color:inherit;border:1px solid #ffffff40;background:none;text-decoration:none;border-radius:5px;padding:9px 14px;cursor:pointer}button[aria-pressed=true]{background:#b2ff1a;color:#171916;border-color:#b2ff1a}main{height:calc(100dvh - 64px);padding:20px;display:flex;justify-content:center}iframe{border:0;background:#f4f4ee;width:100%;height:100%;box-shadow:0 7px 30px #0002;border-radius:6px}iframe.mobile{max-width:390px;border:7px solid #171916;border-radius:24px}header>span{color:#a8ae9e;font-size:11px}@media(max-width:650px){header{padding:0 12px}header>span{display:none}nav{gap:4px}button,a{padding:8px;font-size:11px}main{padding:10px}}</style></head><body><header><strong>kinq</strong><span>HOME / DIRECTION 04</span><nav aria-label="Format de l’aperçu"><button data-mode="desktop" aria-pressed="true">Desktop</button><button data-mode="mobile" aria-pressed="false">Mobile</button><a href="/" target="_blank" rel="noopener">Ouvrir la home</a></nav></header><main><iframe title="Home Kinq responsive" src="/"></iframe></main><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelector('iframe').classList.toggle('mobile',b.dataset.mode==='mobile');document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))})</script></body></html>
