name: Collecte des events

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: events-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer les annonces officielles
        run: python3 scripts/collect-events.py --write
      - name: Signaler les modifications des autres agendas
        run: python3 scripts/check-event-sources.py
        continue-on-error: true
      - name: Enregistrer la file de validation
        run: |
          git add content/event-candidates.json content/event-review.json content/event-source-state.json
          if git diff --cached --quiet; then
            echo 'Aucune nouvelle annonce ni modification de source.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Collecter les annonces Events à vérifier'
          git push origin HEAD:main
